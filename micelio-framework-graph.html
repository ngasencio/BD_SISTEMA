<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MICELIO — Mapa del Framework</title>
<style>
  :root {
    --bg: #05060f;
    --panel: rgba(13, 19, 38, 0.82);
    --border: rgba(125, 211, 252, 0.18);
    --text: #dbe7ff;
    --dim: #7c8db5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; color: var(--text); }
  #scene { position: fixed; inset: 0; display: block; }

  .panel {
    position: fixed;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.45);
    z-index: 10;
  }

  #header { top: 18px; left: 18px; padding: 14px 18px; max-width: 380px; }
  #header h1 {
    font-size: 19px; font-weight: 700; letter-spacing: 2.5px;
    background: linear-gradient(90deg, #7dd3fc, #a78bfa, #f472b6);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #header p { font-size: 11.5px; color: var(--dim); margin-top: 5px; line-height: 1.5; }
  #header .stats { margin-top: 8px; font-size: 10.5px; color: #5d6f99; letter-spacing: 1px; }

  #legend { top: 18px; right: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
  #legend .ltitle { font-size: 10px; letter-spacing: 2px; color: var(--dim); margin-bottom: 2px; }
  .chip {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; padding: 5px 10px; border-radius: 8px;
    cursor: pointer; border: 1px solid transparent;
    transition: all .18s ease; user-select: none;
  }
  .chip:hover { background: rgba(125,211,252,0.08); }
  .chip.active { border-color: rgba(125,211,252,0.5); background: rgba(125,211,252,0.1); }
  .chip .dot { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 8px currentColor; }

  #info {
    bottom: 18px; right: 18px; width: 330px; padding: 16px 18px;
    display: none; max-height: 46vh; overflow-y: auto;
  }
  #info.open { display: block; }
  #info h2 { font-size: 16px; margin-bottom: 2px; }
  #info .cluster-tag {
    display: inline-block; font-size: 10px; letter-spacing: 1.5px;
    padding: 3px 9px; border-radius: 20px; margin: 6px 0 10px;
    border: 1px solid currentColor;
  }
  #info .path { font-size: 10.5px; color: #5d6f99; font-family: 'Consolas', monospace; margin-bottom: 10px; word-break: break-all; }
  #info .desc { font-size: 12.5px; color: var(--text); line-height: 1.55; margin-bottom: 12px; }
  #info .conn-title { font-size: 10px; letter-spacing: 2px; color: var(--dim); margin-bottom: 6px; }
  #info .conn { font-size: 11.5px; padding: 4px 0; color: #aabbe0; border-bottom: 1px dashed rgba(125,211,252,0.12); }
  #info .conn b { color: var(--text); font-weight: 600; }
  #info .conn i { color: #f472b6; font-style: normal; font-size: 10.5px; }
  #info .close {
    position: absolute; top: 10px; right: 12px; cursor: pointer;
    color: var(--dim); font-size: 16px; line-height: 1;
  }
  #info .close:hover { color: #fff; }

  #toolbar { bottom: 18px; left: 18px; padding: 10px 12px; display: flex; gap: 8px; align-items: center; }
  .btn {
    font-size: 11.5px; padding: 7px 13px; border-radius: 8px; cursor: pointer;
    background: rgba(125,211,252,0.07); color: var(--text);
    border: 1px solid var(--border); transition: all .18s ease; user-select: none;
  }
  .btn:hover { background: rgba(125,211,252,0.16); }
  .btn.on { background: rgba(167,139,250,0.22); border-color: rgba(167,139,250,0.55); }
  #toolbar .hint { font-size: 10.5px; color: #5d6f99; margin-left: 6px; }

  #tooltip {
    position: fixed; pointer-events: none; display: none; z-index: 20;
    background: rgba(10,14,30,0.92); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 11px; font-size: 12px;
    transform: translate(14px, 14px); white-space: nowrap;
  }
  #tooltip small { display: block; color: var(--dim); font-size: 10px; margin-top: 2px; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(125,211,252,0.25); border-radius: 3px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
<canvas id="scene"></canvas>

<div id="header" class="panel">
  <h1>MICELIO</h1>
  <p>Fábrica Fractal de Software — mapa interactivo de módulos.<br>
     Las <b>esporas</b> son componentes; las <b>hifas</b> son sus relaciones.</p>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   MODELO DEL FRAMEWORK MICELIO
   ============================================================ */
const CLUSTERS = {
  nucleo:    { name: 'Núcleo Runtime',     color: '#7dd3fc' },
  codegraph: { name: 'CodeGraph',          color: '#a78bfa' },
  mcp:       { name: 'Capa MCP',           color: '#f472b6' },
  agentes:   { name: 'Agentes IA',         color: '#4ade80' },
  memoria:   { name: 'Memoria',            color: '#facc15' },
  ops:       { name: 'Operación & Docs',   color: '#94a3b8' },
  externo:   { name: 'Servicios Externos', color: '#fb923c' },
};

const NODES = [
  // ---- Núcleo runtime ----
  { id:'portal3d',  label:'Portal 3D',        cluster:'nucleo', path:'micelio-core-3d/portal (index.html · trello.html)',
    desc:'Universo fractal Three.js. Renderiza el CodeGraph, agentes vivos, esporas de memoria de sesión, tablero Trello y lienzos HTML de resúmenes.' },
  { id:'backend',   label:'Backend API + WS', cluster:'nucleo', path:'micelio-core-backend (@micelio/backend)',
    desc:'Express + Socket.IO + PostgreSQL. Rutas: factory, codegraph, session-memory, trello, voice, work-session, agent-summaries, yolo-session. Motor de física del universo y printer.service.' },
  { id:'frontend',  label:'Frontend Angular', cluster:'nucleo', path:'micelio-core-frontend · :4200',
    desc:'SPA Angular — HUD administrativo de la fábrica: componentes, servicios y vistas del sistema.' },
  { id:'postgres',  label:'PostgreSQL',       cluster:'nucleo', path:':5432 · db.ts / pg-store.ts',
    desc:'Persistencia relacional: tarjetas Trello, sesiones de trabajo, agentes, embeddings y estado del universo.' },

  // ---- CodeGraph ----
  { id:'cg-engine', label:'CodeGraph Engine', cluster:'codegraph', path:'micelio-core-codegraph (@micelio/codegraph)',
    desc:'Indexa código, documentación y grants. engine.ts + parsers (code/docs/grants) + layout-fractal + session-memory-graph. Es el índice cognitivo unificado del framework.' },
  { id:'snapshot',  label:'.micelio Snapshot', cluster:'codegraph', path:'.micelio/codegraph-snapshot.json',
    desc:'Índice persistente del repo: clases, funciones, docs y relaciones serializadas para consulta inmediata.' },

  // ---- Capa MCP ----
  { id:'mcp-server', label:'MCP Server',        cluster:'mcp', path:'micelio-core-mcp/mcp-server (@micelio/mcp-server)',
    desc:'Servidor MCP de la fábrica. Handlers: session-memory, trello, work-session, grant-proposal y document-compiler.' },
  { id:'mcp-coll',   label:'MCP Collective',    cluster:'mcp', path:'micelio-core-mcp/mcp-collective (@micelio/mcp-collective)',
    desc:'Expone la memoria colectiva multi-agente de la LAN como herramientas MCP.' },
  { id:'collective', label:'Collective Backend',cluster:'mcp', path:'micelio-core-mcp/collective (@micelio/collective)',
    desc:'Backend de memoria colectiva en red local: tareas, agentes, ramas y conocimiento compartido entre agentes.' },
  { id:'ds-back',    label:'Discord Backend',   cluster:'mcp', path:'micelio-core-mcp/discord · :3004',
    desc:'Backend Discord: webhooks, slash commands y endpoints /speak y /tts con ElevenLabs.' },
  { id:'mcp-ds',     label:'MCP Discord + 11L', cluster:'mcp', path:'micelio-core-mcp/mcp-discord-elevenlabs',
    desc:'Servidor MCP para Discord con TTS ElevenLabs. Reemplaza a ds-mcp-mensajes-agente para audio.' },

  // ---- Agentes ----
  { id:'agents',   label:'Agentes IA',   cluster:'agentes', path:'Devin · Antigravity/Windsurf',
    desc:'Agentes de software que consumen las herramientas MCP por stdio, consultan el CodeGraph y escriben artefactos en output/.' },
  { id:'dot-agents', label:'.agents',    cluster:'agentes', path:'.agents/ (skills · rules · workflows)',
    desc:'Cerebro declarativo de los agentes: skills (codegraph-first, session-memory, trello-board…), reglas y workflows.' },

  // ---- Memoria ----
  { id:'sess-mem',  label:'Session Memory', cluster:'memoria', path:'codegraph/session-memory-graph.ts + backend routes',
    desc:'Grafo volátil de sesión: tareas, decisiones, handoffs y pools de subagentes. Vive como esporas doradas en el 3D.' },
  { id:'resumenes', label:'Resúmenes',      cluster:'memoria', path:'resumenes-agentes/',
    desc:'Lienzos HTML publicados por los agentes. Aparecen en el sector aislado (580,120,450) del universo 3D.' },

  // ---- Operación ----
  { id:'arranque',  label:'Arranque',    cluster:'ops', path:'arranque/',
    desc:'Scripts de arranque y provisión: arranque_micelio.sh, clone_all.sh, setup y playbooks de subagentes.' },
  { id:'toolspack', label:'Tools Pack',  cluster:'ops', path:'micelio-core-tools-pack',
    desc:'Paquete meta “micelio-software-factory”: documentación, scripts y AGENTS.md del ecosistema.' },
  { id:'output',    label:'Output',      cluster:'ops', path:'micelio-core-output/output',
    desc:'Artefactos generados por la fábrica: código, reportes y entregas visuales como este mapa.' },
  { id:'refs',      label:'Referencias', cluster:'ops', path:'micelio-core-referencias',
    desc:'Material de referencia indexable (calibration-camera, documentos).' },

  // ---- Externos ----
  { id:'discord-api', label:'Discord API', cluster:'externo', path:'discord.com/api/webhooks',
    desc:'Canal de entrega: mensajes, adjuntos y audios llegan al servidor Discord del equipo.' },
  { id:'elevenlabs',  label:'ElevenLabs',  cluster:'externo', path:'api.elevenlabs.io · voz 6Gr4AVmTax1pMJO0lHRK',
    desc:'TTS hiperrealista. Regla de oro: audio para Discord SIEMPRE vía backend :3004 /speak.' },
];

const EDGES = [
  // Agentes -> MCP
  { a:'agents', b:'mcp-server', rel:'tools · stdio' },
  { a:'agents', b:'mcp-coll',   rel:'tools · stdio' },
  { a:'agents', b:'mcp-ds',     rel:'tools · stdio' },
  { a:'dot-agents', b:'agents', rel:'skills · rules · workflows' },
  { a:'agents', b:'output',     rel:'genera artefactos' },

  // MCP -> backends
  { a:'mcp-server', b:'backend',  rel:'REST /api' },
  { a:'mcp-coll',   b:'collective', rel:'API LAN' },
  { a:'mcp-ds',     b:'ds-back',  rel:'HTTP :3004' },

  // Cadena de voz Discord
  { a:'ds-back', b:'elevenlabs',  rel:'TTS /speak' },
  { a:'ds-back', b:'discord-api', rel:'webhook + mp3' },

  // CodeGraph
  { a:'cg-engine', b:'snapshot', rel:'persiste índice' },
  { a:'cg-engine', b:'backend',  rel:'índice vía codegraph.routes' },
  { a:'refs',      b:'cg-engine',rel:'material indexable' },
  { a:'sess-mem',  b:'cg-engine',rel:'session-memory-graph' },
  { a:'sess-mem',  b:'backend',  rel:'session-memory.routes' },
  { a:'mcp-server',b:'sess-mem', rel:'handlers' },

  // Núcleo
  { a:'backend',  b:'postgres',  rel:'persiste' },
  { a:'backend',  b:'portal3d',  rel:'WebSocket push' },
  { a:'portal3d', b:'backend',   rel:'REST consultas' },
  { a:'frontend', b:'backend',   rel:'REST / WS' },
  { a:'backend',  b:'resumenes', rel:'agent-summaries.routes' },
  { a:'resumenes',b:'portal3d',  rel:'lienzo 3D' },

  // Operación
  { a:'arranque',  b:'backend',  rel:'levanta servicios' },
  { a:'arranque',  b:'ds-back',  rel:'npm run dev' },
  { a:'toolspack', b:'agents',   rel:'documenta' },
];

/* ============================================================
   ESCENA
   ============================================================ */
const canvas   = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060f);
scene.fog = new THREE.FogExp2(0x05060f, 0.00085);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 1, 6000);
camera.position.set(0, 140, 780);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.45;
controls.minDistance = 80;
controls.maxDistance = 2400;

scene.add(new THREE.AmbientLight(0xffffff, 0.9));
const keyLight = new THREE.PointLight(0x8fb8ff, 1.2, 3000);
keyLight.position.set(300, 400, 300);
scene.add(keyLight);

/* ---------- Fondo estrellado ---------- */
{
  const N = 1400, pos = new Float32Array(N*3);
  for (let i=0;i<N;i++){
    const r = 1400 + Math.random()*2200;
    const t = Math.random()*Math.PI*2, p = Math.acos(2*Math.random()-1);
    pos[i*3]   = r*Math.sin(p)*Math.cos(t);
    pos[i*3+1] = r*Math.sin(p)*Math.sin(t);
    pos[i*3+2] = r*Math.cos(p);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({
    color:0x5f74b8, size:2.2, sizeAttenuation:true, transparent:true, opacity:0.55
  })));
}

/* ---------- Texturas de canvas ---------- */
function glowTexture(hex){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d');
  const col = new THREE.Color(hex);
  const rgb = `${col.r*255|0},${col.g*255|0},${col.b*255|0}`;
  const g = x.createRadialGradient(128,128,0,128,128,128);
  g.addColorStop(0, `rgba(${rgb},0.9)`);
  g.addColorStop(0.28, `rgba(${rgb},0.38)`);
  g.addColorStop(1, `rgba(${rgb},0)`);
  x.fillStyle = g; x.fillRect(0,0,256,256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function labelTexture(text, hex, scale=1){
  const fs = 44*scale, pad = 18*scale;
  const c = document.createElement('canvas');
  let x = c.getContext('2d');
  x.font = `600 ${fs}px 'Segoe UI', system-ui, sans-serif`;
  c.width  = Math.ceil(x.measureText(text).width) + pad*2;
  c.height = fs + pad*2;
  x = c.getContext('2d');
  x.font = `600 ${fs}px 'Segoe UI', system-ui, sans-serif`;
  x.textAlign='center'; x.textBaseline='middle';
  x.shadowColor='rgba(0,0,0,0.9)'; x.shadowBlur=10*scale;
  x.fillStyle = hex;
  x.fillText(text, c.width/2, c.height/2);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return { tex:t, aspect:c.width/c.height };
}

const glowTexCache = {};
function getGlow(hex){ return glowTexCache[hex] ??= glowTexture(hex); }

/* ---------- Construcción de nodos ---------- */
const nodeById = {};
const pickables = [];

// Anclas de cluster en esfera de Fibonacci
const clusterIds = Object.keys(CLUSTERS);
const anchors = {};
clusterIds.forEach((cid,i)=>{
  const k = i + 0.5, n = clusterIds.length;
  const phi = Math.acos(1 - 2*k/n), theta = Math.PI*(1+Math.sqrt(5))*k;
  anchors[cid] = new THREE.Vector3(
    Math.sin(phi)*Math.cos(theta), Math.cos(phi), Math.sin(phi)*Math.sin(theta)
  ).multiplyScalar(230);
});

NODES.forEach((d)=>{
  const col = new THREE.Color(CLUSTERS[d.cluster].color);
  const group = new THREE.Group();

  const core = new THREE.Mesh(
    new THREE.SphereGeometry(11, 24, 24),
    new THREE.MeshBasicMaterial({ color: col })
  );
  core.userData.node = d;
  group.add(core);

  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: getGlow(CLUSTERS[d.cluster].color), transparent:true,
    blending: THREE.AdditiveBlending, depthWrite:false, opacity:0.85
  }));
  glow.scale.setScalar(58);
  group.add(glow);

  const { tex, aspect } = labelTexture(d.label, '#eaf2ff');
  const label = new THREE.Sprite(new THREE.SpriteMaterial({
    map:tex, transparent:true, depthWrite:false
  }));
  const lh = 26; label.scale.set(lh*aspect, lh, 1);
  label.position.y = -30;
  group.add(label);

  // posición inicial: jitter alrededor del ancla del cluster
  group.position.copy(anchors[d.cluster]).add(new THREE.Vector3(
    (Math.random()-0.5)*150,(Math.random()-0.5)*150,(Math.random()-0.5)*150
  ));

  scene.add(group);
  nodeById[d.id] = { data:d, group, core, glow, label,
                     vel:new THREE.Vector3(), pulse:Math.random()*Math.PI*2 };
  pickables.push(core);
});

/* ---------- Construcción de hifas (edges) ---------- */
const SEGS = 28;
const edges = EDGES.map((e,i)=>{
  const na = nodeById[e.a], nb = nodeById[e.b];
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array((SEGS+1)*3),3));
  const col = new THREE.Color(CLUSTERS[na.data.cluster].color)
                .lerp(new THREE.Color(CLUSTERS[nb.data.cluster].color), 0.5);
  const line = new THREE.Line(g, new THREE.LineBasicMaterial({
    color: col, transparent:true, opacity:0.4
  }));
  scene.add(line);

  // etiqueta de relación en el punto medio
  const { tex, aspect } = labelTexture(e.rel, '#8fa4d0', 0.72);
  const rel = new THREE.Sprite(new THREE.SpriteMaterial({
    map:tex, transparent:true, depthWrite:false, opacity:0.6
  }));
  const rh = 12; rel.scale.set(rh*aspect, rh, 1);
  scene.add(rel);

  // curvatura determinista por arista
  const bend = ((i*37)%11 - 5) / 5 * 0.22 + 0.14;

  return { ...e, na, nb, line, rel, bend,
           packets:[{t:Math.random()},{t:(Math.random()+0.5)%1}] };
});

// puntos-paquete que viajan por las hifas
const packetCount = edges.reduce((s,e)=>s+e.packets.length,0);
const packetGeo = new THREE.BufferGeometry();
packetGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(packetCount*3),3));
const packetCols = new Float32Array(packetCount*3);
edges.forEach((e,i)=>{
  const c = e.line.material.color;
  e.packets.forEach((p,j)=>{
    const k=(e.packets.slice(0,j).length + edges.slice(0,i).reduce((s,x)=>s+x.packets.length,0))*3;
    packetCols[k]=c.r; packetCols[k+1]=c.g; packetCols[k+2]=c.b;
  });
});
packetGeo.setAttribute('color', new THREE.BufferAttribute(packetCols,3));
const packets = new THREE.Points(packetGeo, new THREE.PointsMaterial({
  size:9, map:getGlow('#ffffff'), vertexColors:true, transparent:true,
  blending:THREE.AdditiveBlending, depthWrite:false, opacity:0.95
}));
scene.add(packets);

/* ---------- Física force-directed ---------- */
const tmpV = new THREE.Vector3(), tmpF = new THREE.Vector3();
let alpha = 1;

function stepPhysics(dt){
  const ids = Object.keys(nodeById);
  // repulsión
  for (let i=0;i<ids.length;i++){
    const A = nodeById[ids[i]];
    for (let j=i+1;j<ids.length;j++){
      const B = nodeById[ids[j]];
      tmpV.subVectors(A.group.position, B.group.position);
      let d = tmpV.length() || 1;
      const f = Math.min(26000/(d*d), 40) * alpha;
      tmpV.normalize().multiplyScalar(f*dt);
      A.vel.add(tmpV); B.vel.sub(tmpV);
    }
    // atracción al ancla del cluster + centrado global
    tmpF.copy(anchors[A.data.cluster]).sub(A.group.position)
         .multiplyScalar(0.010*alpha*dt*60);
    A.vel.add(tmpF);
    tmpF.copy(A.group.position).multiplyScalar(-0.0016*alpha*dt*60);
    A.vel.add(tmpF);
  }
  // resortes en aristas
  edges.forEach(e=>{
    const A = e.na.group.position, B = e.nb.group.position;
    tmpV.subVectors(B, A);
    const d = tmpV.length() || 1;
    const f = (d - 150) * 0.012 * alpha;
    tmpV.normalize().multiplyScalar(f*dt);
    e.na.vel.add(tmpV); e.nb.vel.sub(tmpV);
  });
  // integración
  ids.forEach(id=>{
    const n = nodeById[id];
    n.vel.multiplyScalar(0.86);
    if (n.vel.length()>30) n.vel.setLength(30);
    n.group.position.addScaledVector(n.vel, dt*60);
  });
  alpha = Math.max(0.035, alpha*0.995);
}

/* ---------- Actualización visual por frame ---------- */
const pArr = packetGeo.attributes.position.array;
function updateEdges(time){
  let pi = 0;
  edges.forEach(e=>{
    const A = e.na.group.position, B = e.nb.group.position;
    // punto de control perpendicular
    tmpV.addVectors(A,B).multiplyScalar(0.5);
    const mid = tmpV.clone();
    const dir = new THREE.Vector3().subVectors(B,A);
    const perp = new THREE.Vector3(-dir.z, dir.y*0.4+30, dir.x).normalize();
    const ctrl = mid.clone().addScaledVector(perp, dir.length()*e.bend);
    const curve = new THREE.QuadraticBezierCurve3(A.clone(), ctrl, B.clone());

    const pos = e.line.geometry.attributes.position;
    for (let s=0;s<=SEGS;s++){
      const p = curve.getPoint(s/SEGS);
      pos.setXYZ(s, p.x, p.y, p.z);
    }
    pos.needsUpdate = true;

    e.rel.position.copy(curve.getPoint(0.5));

    e.packets.forEach(pk=>{
      pk.t = (pk.t + 0.0035 + 0.0015*Math.sin(time*0.7)) % 1;
      const p = curve.getPoint(pk.t);
      pArr[pi++]=p.x; pArr[pi++]=p.y; pArr[pi++]=p.z;
    });
  });
  packetGeo.attributes.position.needsUpdate = true;
}

function updateNodes(time){
  Object.values(nodeById).forEach(n=>{
    n.pulse += 0.03;
    const s = 1 + Math.sin(n.pulse)*0.10;
    if (n !== hovered && n !== selected) n.core.scale.setScalar(s);
  });
}

/* ---------- Interacción ---------- */
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hovered = null, selected = null, isolatedCluster = null;
const tooltip = document.getElementById('tooltip');

function nodeAt(ev){
  mouse.set(ev.clientX/innerWidth*2-1, -(ev.clientY/innerHeight)*2+1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(pickables, false)[0];
  return hit ? nodeById[hit.object.userData.node.id] : null;
}

function applyHighlight(){
  const focus = hovered || selected;
  const involved = new Set();
  if (focus) involved.add(focus.data.id);
  if (focus) edges.forEach(e=>{
    if (e.a===focus.data.id||e.b===focus.data.id){ involved.add(e.a); involved.add(e.b); }
  });

  Object.values(nodeById).forEach(n=>{
    let op = 1, dimCore = 1;
    if (isolatedCluster && n.data.cluster!==isolatedCluster){ op=0.08; dimCore=0.35; }
    if (focus && !involved.has(n.data.id)){ op=0.12; dimCore=0.4; }
    n.label.material.opacity = op;
    n.glow.material.opacity  = 0.85*op;
    n.core.material.color.copy(new THREE.Color(CLUSTERS[n.data.cluster].color)
       .multiplyScalar(dimCore));
    n.core.material.transparent = op<1;
    n.core.material.opacity = Math.max(op,0.15);
    const target = (n===focus)?1.55:1;
    n.core.scale.setScalar(THREE.MathUtils.lerp(n.core.scale.x,target,0.4));
  });

  edges.forEach(e=>{
    let op = 0.4, rop = 0.6;
    const hot = focus && (e.a===focus.data.id||e.b===focus.data.id);
    if (isolatedCluster){
      const inC = e.na.data.cluster===isolatedCluster && e.nb.data.cluster===isolatedCluster;
      if (!inC){ op=0.05; rop=0; }
    }
    if (focus){ op = hot?0.95:0.07; rop = hot?1:0; }
    e.line.material.opacity = op;
    e.rel.material.opacity  = rop;
  });
}

addEventListener('pointermove', (ev)=>{
  if (ev.target!==renderer.domElement){ hovered=null; tooltip.style.display='none'; applyHighlight(); return; }
  const n = nodeAt(ev);
  if (n!==hovered){ hovered=n; applyHighlight(); }
  if (n){
    tooltip.style.display='block';
    tooltip.style.left=ev.clientX+'px'; tooltip.style.top=ev.clientY+'px';
    tooltip.innerHTML = `<b>${n.data.label}</b><small>${CLUSTERS[n.data.cluster].name} — click para detalles</small>`;
    canvas.style.cursor='pointer';
  } else { tooltip.style.display='none'; canvas.style.cursor='grab'; }
});

let downX=0, downY=0;
addEventListener('pointerdown', e=>{ downX=e.clientX; downY=e.clientY; controls.autoRotate=false; btnRotate.classList.remove('on'); });
addEventListener('pointerup', (e)=>{
  if (Math.hypot(e.clientX-downX,e.clientY-downY)>6 || e.target!==renderer.domElement) return;
  const n = nodeAt(e);
  selected = n;
  applyHighlight();
  if (n) showInfo(n); else hideInfo();
});

/* ---------- Panel de información ---------- */
const infoEl = document.getElementById('info');
function showInfo(n){
  const d = n.data, c = CLUSTERS[d.cluster];
  document.getElementById('infoName').textContent = d.label;
  const tag = document.getElementById('infoCluster');
  tag.textContent = c.name; tag.style.color = c.color;
  document.getElementById('infoPath').textContent = d.path;
  document.getElementById('infoDesc').textContent = d.desc;
  document.getElementById('infoConns').innerHTML = edges
    .filter(e=>e.a===d.id||e.b===d.id)
    .map(e=>{
      const other = e.a===d.id ? e.b : e.a;
      const arrow = e.a===d.id ? '→' : '←';
      return `<div class="conn">${arrow} <b>${nodeById[other].data.label}</b> <i>· ${e.rel}</i></div>`;
    }).join('');
  infoEl.classList.add('open');
}
function hideInfo(){ infoEl.classList.remove('open'); selected=null; applyHighlight(); }
document.getElementById('infoClose').onclick = hideInfo;

/* ---------- Leyenda / aislamiento de clusters ---------- */
const legend = document.getElementById('legend');
clusterIds.forEach(cid=>{
  const c = CLUSTERS[cid];
  const chip = document.createElement('div');
  chip.className='chip';
  chip.innerHTML = `<span class="dot" style="background:${c.color};color:${c.color}"></span>${c.name}`;
  chip.onclick = ()=>{
    isolatedCluster = isolatedCluster===cid ? null : cid;
    document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
    if (isolatedCluster) chip.classList.add('active');
    applyHighlight();
  };
  legend.appendChild(chip);
});

/* ---------- Toolbar ---------- */
const btnRotate = document.getElementById('btnRotate');
document.getElementById('btnReset').onclick = ()=>{
  camera.position.set(0,140,780); controls.target.set(0,0,0);
};
btnRotate.onclick = ()=>{
  controls.autoRotate = !controls.autoRotate;
  btnRotate.classList.toggle('on', controls.autoRotate);
};
document.getElementById('btnAll').onclick = ()=>{
  isolatedCluster=null; selected=null; hideInfo();
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
  applyHighlight();
};

document.getElementById('stats').textContent =
  `${NODES.length} esporas · ${EDGES.length} hifas · ${clusterIds.length} clusters`;

/* ---------- Loop ---------- */
const clock = new THREE.Clock();
(function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  stepPhysics(dt);
  updateEdges(t);
  updateNodes(t);
  controls.update();
  renderer.render(scene, camera);
})();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
